<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="Player 2's controller: every button except plus and minus is live for Cheshire; the left half mirrors the right half.">
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; stroke: #d5ddd7; stroke-width: 1.5; }
    .band { fill: #1d7a6c; }
    .title { font-size: 19px; font-weight: 700; fill: #1d7a6c; }
    .sub { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #5b6a63; }
    .pad-body { fill: #ffffff; stroke: #d5ddd7; stroke-width: 2; }
    .btn { stroke-width: 1.6; }
    .on { fill: #1d7a6c; stroke: #1d7a6c; }
    .fold { fill: #dcf0eb; stroke: #1d7a6c; stroke-dasharray: 4 3; }
    .off { fill: #f3f5f1; stroke: #c3ccc7; }
    .x { stroke: #c3ccc7; stroke-width: 2; }
    .lbl { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #5b6a63; }
    .on + .lbl { fill: #ffffff; }
    .key { font-size: 12px; fill: #5b6a63; dominant-baseline: central; }
  </style>
  <rect class="bg" x="0.75" y="0.75" width="398.5" height="328.5" rx="14"/>
  <clipPath id="card"><rect x="0.75" y="0.75" width="398.5" height="328.5" rx="14"/></clipPath>
  <rect class="band" x="0" y="0" width="400" height="6" clip-path="url(#card)"/>
  <text class="sub" x="20" y="30">PLAYER 2</text>
  <text class="title" x="20" y="52">Cheshire</text>
  <g transform="translate(0 64)">
    <path class="pad-body" d="M120 52 H280 C330 52 362 70 372 110 L392 196 C398 222 376 236 354 226 C332 216 318 190 296 176 H104 C82 190 68 216 46 226 C24 236 2 222 8 196 L28 110 C38 70 70 52 120 52 Z"/>
    <rect class="btn fold" x="66" y="6" width="84" height="16" rx="8"/><text class="lbl" x="108" y="14">ZL → ZR</text>
    <rect class="btn on" x="60" y="28" width="96" height="16" rx="8"/><text class="lbl" x="108" y="36">L · Hug</text>
    <rect class="btn on" x="250" y="6" width="84" height="16" rx="8"/><text class="lbl" x="292" y="14">ZR</text>
    <rect class="btn on" x="244" y="28" width="96" height="16" rx="8"/><text class="lbl" x="292" y="36">R</text>
    <circle class="btn fold" cx="110" cy="105" r="22"/><text class="lbl" x="110" y="105">move</text>
    <path class="btn fold" d="M143 136 h14 v14 h14 v14 h-14 v14 h-14 v-14 h-14 v-14 h14 z"/>
    <circle class="btn on" cx="266" cy="105" r="11"/><text class="lbl" x="266" y="105">Y</text>
    <circle class="btn on" cx="290" cy="81" r="11"/><text class="lbl" x="290" y="81">X</text>
    <circle class="btn on" cx="314" cy="105" r="11"/><text class="lbl" x="314" y="105">A</text>
    <circle class="btn on" cx="290" cy="129" r="11"/><text class="lbl" x="290" y="129">B</text>
    <circle class="btn on" cx="250" cy="157" r="22"/><text class="lbl" x="250" y="157">move</text>
    <circle class="btn off" cx="168" cy="88" r="8"/><line class="x" x1="162" y1="82" x2="174" y2="94"/>
    <circle class="btn off" cx="232" cy="88" r="8"/><line class="x" x1="226" y1="82" x2="238" y2="94"/>
  </g>
  <g transform="translate(20 308)">
    <rect class="btn on" x="0" y="-7" width="14" height="14" rx="4"/><text class="key" x="20" y="0">Cheshire's own</text>
    <rect class="btn fold" x="118" y="-7" width="14" height="14" rx="4"/><text class="key" x="138" y="0">folded onto Cheshire</text>
    <rect class="btn off" x="270" y="-7" width="14" height="14" rx="4"/><text class="key" x="290" y="0">disabled</text>
  </g>
</svg>
